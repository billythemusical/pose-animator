<!DOCTYPE html>
<html>
<head>
    <title>Pose Animator controls</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            color: #eee;
            font-family: sans-serif;
        }

        #banner {
            padding: 8px 12px;
            font-size: 14px;
            background: #3a2a00;
        }

        #banner.connected {
            background: #12331a;
        }

        /* Phone: camera view on top, controls underneath. */
        #layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        #view {
            width: 100%;
            max-height: 70vh;
            object-fit: contain;
            background: #000;
        }

        #controls {
            width: 400px;
            max-width: 100%;
        }

        #controls .dg.main {
            width: 100% !important;
        }

        /* Desktop browser: controls on the left, camera view to the right. */
        @media (min-width: 900px) {
            #layout {
                flex-direction: row-reverse;
                align-items: flex-start;
                justify-content: center;
                padding: 12px;
            }

            #view {
                flex: 1;
                max-width: 960px;
                max-height: calc(100vh - 80px);
                position: sticky;
                top: 12px;
            }

            #controls {
                flex: none;
            }
        }
    </style>
</head>
<body>
    <div id="banner">Connecting to the show page...</div>
    <div id="layout">
        <canvas id="view" width="480" height="270"></canvas>
        <div id="controls"></div>
    </div>
    <script type="module" src="panel.js"></script>
</body>
</html>
