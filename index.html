<!DOCTYPE html>
<html>

<head>
    <title>Pose Animator</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: black;
        }

        .canvas-container {
            display: flex;
            justify-content: center;
            position: relative;
            background-size: 100% 100%;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        /* Holds the camera view when it's shown on the projector. */
        #main {
            left: 0;
            top: 0;
            position: absolute;
            z-index: 2;
        }

        /* "Let's dance!" sign, centered over the canvas while nobody is in frame. */
        #idle-prompt {
            position: absolute;
            inset: 0;
            margin: auto;
            width: min(80%, 800px);
            height: auto;
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }

        #idle-prompt.visible {
            opacity: 1;
        }

        .footer {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            color: black;
        }

        .footer-text {
            max-width: 600px;
            text-align: center;
            margin: auto;
        }

        @media only screen and (max-width: 600px) {

            .footer-text,
            .dg {
                display: none;
            }
        }

        /*
         *  The following loading spinner CSS is from SpinKit project
         *  https://github.com/tobiasahlin/SpinKit
         */
        .sk-spinner-pulse {
            width: 20px;
            height: 20px;
            margin: auto 10px;
            float: left;
            background-color: #333;
            border-radius: 100%;
            -webkit-animation: sk-pulseScaleOut 1s infinite ease-in-out;
            animation: sk-pulseScaleOut 1s infinite ease-in-out;
        }

        @-webkit-keyframes sk-pulseScaleOut {
            0% {
                -webkit-transform: scale(0);
                transform: scale(0);
            }

            100% {
                -webkit-transform: scale(1.0);
                transform: scale(1.0);
                opacity: 0;
            }
        }

        @keyframes sk-pulseScaleOut {
            0% {
                -webkit-transform: scale(0);
                transform: scale(0);
            }

            100% {
                -webkit-transform: scale(1.0);
                transform: scale(1.0);
                opacity: 0;
            }
        }

        .spinner-text {
            float: left;
        }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
    <div id="info">
    </div>
    <div id="loading" style='position: relative; left: 0'>
        <span class="spinner-text" id="status">
            Loading...
        </span>
        <div class="sk-spinner sk-spinner-pulse"></div>
    </div>
    <div class="canvas-container">
        <div id='main'>
            <video id="video" playsinline style="display: none"></video>
        </div>
        <canvas class="illustration-canvas"></canvas>
        <img id="idle-prompt" alt="">
        <!-- <img src='resources/images/dance-crop.png' width=960 height=720 /> -->
    </div>
    <div class="footer">
        <!-- <img src='resources/images/dance-crop.png' width=823 height=247 style="padding-left: 20px;"/> -->
        <!-- <img src='resources/images/lets-dance-crop.png' width=800 height=200 style="padding-left: 30px;"/> -->
        <div class="footer-text">
            
            <!-- <img src="resources/images/qr-code.png" width=200 height=200 /> -->
            <!-- <p> -->
                <!-- Based on Pose Animator by yemount - https://github.com/yemount/pose-animator -->
            <!-- </p> -->
        </div>
      </div>
    <script type="module" src="camera.js"></script>
</body>

</html>
